name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Production build (static SPA)
        env:
          STATIC_BUILD: "true"
          # Repo-name base path, e.g. /my-repo/ — replaced by "/" when a custom
          # domain (public/CNAME) is used, since that serves from the root.
          BASE_PATH: /${{ github.event.repository.name }}/
          # Backend URL is configurable; set the repository variable
          # VITE_API_BASE_URL under Settings → Secrets and variables → Actions → Variables.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [ -f public/CNAME ]; then export BASE_PATH=/; fi
          npm run build:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
